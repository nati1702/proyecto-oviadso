<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Confirmar Cuenta</title>

</head>

<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0">

        <tr>

            <td align="center">

                <table width="650" cellpadding="0" cellspacing="0"
                    style="background:white;margin-top:40px;border-radius:10px;overflow:hidden;">

                    <tr>

                        <td style="background:#1d4ed8;padding:25px;text-align:center;color:white;">

                            <h1>@nombreEmpresa</h1>

                        </td>

                    </tr>

                    <tr>

                        <td style="padding:40px;">

                            <h2>Hola @name</h2>

                            <p>

                                Gracias por registrarte en <b>@nombreEmpresa</b>.

                            </p>

                            <p>

                                Para activar tu cuenta debes confirmar tu correo electrónico.

                            </p>

                            <br>

                            <center>

                                <a href="@link" 
                                style="background:#16a34a;
                                color:white;
                                padding:15px 35px;
                                text-decoration:none;
                                border-radius:8px;
                                font-size:18px;">

                                    @nameBtn

                                </a>

                            </center>

                            <br><br>

                            <p>

                                Si no solicitaste este registro puedes ignorar este mensaje.

                            </p>

                            <hr>

                            <center>

                                © 2026 OVIADSO

                            </center>

                        </td>

                    </tr>

                </table>

            </td>

        </tr>

    </table>

</body>

</html>
